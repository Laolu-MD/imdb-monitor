name: IMDb High Score Monitor

on:
  schedule:
    # 每天 UTC 13:17 运行（避开整点）
    - cron: '17 13 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          MIN_RATING: "8.0"
          MIN_VOTES: "10000"
          MAX_OMDB_PER_RUN: "15"
        run: python monitor.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ rating_changes.csv latest_report.txt latest.csv metadata_cache.json || true
          git diff --staged --quiet || git commit -m "Update high-score list ${{ github.run_id }} [skip ci]"
          git push
        continue-on-error: true
