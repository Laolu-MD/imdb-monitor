name: IMDb Rating Monitor

on:
  schedule:
    # 每天 UTC 12:23 运行（避开整点高峰，可改成你想要的时间）
    - cron: '23 12 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写入权限才能 commit 回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run monitor
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python monitor.py

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.csv rating_history.csv metadata_cache.json latest_report.txt || true
          git diff --staged --quiet || git commit -m "Update ratings and metadata [skip ci]"
          git push
        continue-on-error: true
