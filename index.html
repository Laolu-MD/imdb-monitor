<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电影清单</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17283d;font:15px system-ui, sans-serif}header{background:#13243b;color:white;padding:16px max(20px,calc((100vw - 1150px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1150px;margin:auto;padding:25px 18px}.card{background:white;border:1px solid #dfe6ee;border-radius:12px;padding:18px;margin:14px 0}.muted{color:#66778c;font-size:13px;line-height:1.6}.grid{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{font-size:12px;color:#66778c;display:grid;gap:4px}input,select,button{padding:9px;border:1px solid #ccd8e4;border-radius:7px;background:white;font:inherit}button{cursor:pointer}.primary{background:#1b588c;color:white;border:0}.wide{flex:1;min-width:220px}table{border-collapse:collapse;width:100%;min-width:850px}td,th{text-align:left;border-bottom:1px solid #edf0f4;padding:11px 7px;vertical-align:top}th{color:#75859a;font-size:12px}td{font-size:13px}a{color:#245d91;font-weight:600}.scroll{overflow:auto}.score{color:#b37b00;font-weight:700}.name{min-width:200px}.note{width:150px}.nav{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px}#message{color:#a44230}.hidden{display:none}.multi{position:relative;font-size:12px;color:#66778c}.multi summary{cursor:pointer;list-style:none;border:1px solid #ccd8e4;border-radius:7px;background:#fff;padding:9px;min-width:124px;font-size:15px;color:#17283d}.multi summary::-webkit-details-marker{display:none}.multi-panel{position:absolute;top:100%;left:0;background:white;border:1px solid #dce4ed;border-radius:8px;padding:10px;z-index:4;box-shadow:0 6px 20px #1232;width:220px;max-height:280px;overflow:auto}.multi-panel label{display:flex;align-items:center;gap:7px;padding:4px;color:#25374b;font-size:13px}.multi-panel input{padding:0}
</style></head><body><header><b>★ 电影清单</b><span><span id="user"></span> <button id="logout" class="hidden">退出</button></span></header><main><h1>发现值得看的电影</h1><p class="muted">IMDb 评分 7.0 以上 · 每日更新 · 观看记录保存在你的账户</p>
<section id="auth" class="card"><h2>登录</h2><p class="muted">使用你创建的电影账号。密码直接提交给 Supabase。</p><form id="login"><div class="grid"><label>邮箱<input name="email" type="email" required></label><label>密码<input name="password" type="password" required></label><button class="primary">登录</button></div></form><p id="loginError"></p></section>
<section id="app" class="hidden"><div class="card"><div class="grid"><label class="wide">搜索电影、导演、演员<input id="q" placeholder="输入片名、导演或演员"></label><label>最低评分<input id="rating" type="number" min="7" max="10" value="7" step="0.1"></label><label>年份从<input id="year1" type="number" placeholder="不限" style="width:100px"></label><label>年份至<input id="year2" type="number" placeholder="不限" style="width:100px"></label><div class="multi">语言<details id="langMenu"><summary id="langTitle">全部语言 ▾</summary><div id="lang" class="multi-panel"></div></details></div><div class="multi">类型<details id="genreMenu"><summary id="genreTitle">全部类型 ▾</summary><div id="genre" class="multi-panel"></div></details></div><label>观看状态<select id="watched"><option value="">全部</option><option value="yes">已观看</option><option value="want">想看</option><option value="no">未观看</option></select></label><label>排序<select id="sort"><option value="rating">评分</option><option value="votes">投票数</option><option value="year">年份</option><option value="title">片名</option></select></label></div><p class="muted">语言、导演、演员信息正在逐步补全；未收录信息的电影无法通过这些字段匹配。</p><span id="message" role="status"></span></div><div class="card"><b id="count"></b><div class="scroll"><table><thead><tr><th>电影</th><th>评分 / 票数</th><th>年份 / 语言</th><th>导演 / 演员</th><th>已看</th><th>想看</th><th>类型</th><th>备注（失焦保存）</th></tr></thead><tbody id="rows"></tbody></table></div><div class="nav"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></div></section></main>
<script>
const URLS='https://fuezbhzwzemlnziakwcu.supabase.co',KEY='sb_publishable_KQeC1HiP9NdcQbnUd92Aug_xYwtul2A',OWNER='45572a09-18ba-4d66-8b3c-684b70d5cc9e';let session=null,movies=[],meta={},records={},page=1,filtered=[];const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function msg(t){$('message').textContent=t}function headers(extra={}){return {apikey:KEY,Authorization:'Bearer '+session.access_token,...extra}} async function request(path,options={}){let r=await fetch(URLS+path,options);if(!r.ok)throw Error('服务请求失败 '+r.status);let text=await r.text();return text.trim()?JSON.parse(text):null}
function csv(text){let rows=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if(c==='\n'&&!quoted){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v.replace(/\r$/,''));rows.push(row)}let h=rows.shift();return rows.filter(r=>r.length>=h.length).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))}
async function start(s){if(!s.user||s.user.id!==OWNER)throw Error('此账号无权使用电影工具');session=s;sessionStorage.setItem('film_session',JSON.stringify(s));$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('user').textContent=s.user.email;msg('正在加载数据…');let [a,b,c]=await Promise.all([fetch('./latest.csv?ts='+Date.now()),fetch('./metadata_cache.json?ts='+Date.now()),request('/rest/v1/personal_records?select=*&limit=1000',{headers:headers({'Accept-Profile':'film_monitor'})})]);if(!a.ok||!b.ok)throw Error('电影数据暂不可用');movies=csv(await a.text());meta=await b.json();records=Object.fromEntries(c.map(x=>[x.imdb_id,x]));let langs=new Set(),genres=new Set();Object.values(meta).forEach(m=>(m.language||'').split(',').map(x=>x.trim()).filter(x=>x&&x!=='N/A').forEach(x=>langs.add(x)));movies.forEach(m=>(m.genres||'').split('|').map(x=>x.trim()).filter(x=>x&&x!=='\\N').forEach(x=>genres.add(x)));let fill=(id,items)=>{$(id).innerHTML=[...items].sort().map(x=>'<label><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')};fill('lang',langs);fill('genre',genres);msg('');render()}
$('login').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='登录中…';let f=new FormData(e.target);try{let s=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});e.target.reset();await start(s)}catch(err){$('loginError').textContent='登录或加载失败：'+err.message}};
$('logout').onclick=()=>{sessionStorage.removeItem('film_session');location.reload()};
function render(){let q=$('q').value.trim().toLowerCase(),lo=+$('rating').value||7,y1=+$('year1').value||0,y2=+$('year2').value||9999,ls=[...$('lang').querySelectorAll('input:checked')].map(x=>x.value),gs=[...$('genre').querySelectorAll('input:checked')].map(x=>x.value),w=$('watched').value,sort=$('sort').value;$('langTitle').textContent=ls.length?'已选 '+ls.length+' 种语言 ▾':'全部语言 ▾';$('genreTitle').textContent=gs.length?'已选 '+gs.length+' 种类型 ▾':'全部类型 ▾';filtered=movies.filter(m=>{let x=meta[m.imdb_id]||{},r=records[m.imdb_id]||{};return [m.title,x.director,x.actors].join(' ').toLowerCase().includes(q)&&+m.rating>=lo&&+m.year>=y1&&+m.year<=y2&&(!ls.length||ls.some(l=>(x.language||'').split(',').map(x=>x.trim()).includes(l)))&&(!gs.length||gs.some(g=>(m.genres||'').split('|').map(x=>x.trim()).includes(g)))&&(!w||(w==='yes'&&!!r.watched)||(w==='want'&&!!r.want_to_watch)||(w==='no'&&!r.watched))});filtered.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):(+b[sort]||0)-(+a[sort]||0));let pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.min(page,pages);$('count').textContent='符合条件：'+filtered.length+' 部';$('page').textContent=page+' / '+pages;$('prev').disabled=page===1;$('next').disabled=page===pages;$('rows').innerHTML=filtered.slice((page-1)*50,page*50).map(m=>{let x=meta[m.imdb_id]||{},r=records[m.imdb_id]||{};return '<tr><td class="name"><a target="_blank" rel="noopener" href="https://www.imdb.com/title/'+esc(m.imdb_id)+'/">'+esc(m.title)+' ↗</a></td><td class="score">'+esc(m.rating)+'<div class="muted">'+Number(m.votes).toLocaleString()+' 票</div></td><td>'+esc(m.year)+'<div class="muted">'+esc(x.language||'待补充')+'</div></td><td>'+esc(x.director||'待补充')+'<div class="muted">'+esc(x.actors||'')+'</div></td><td><input type="checkbox" data-check="'+esc(m.imdb_id)+'" '+(r.watched?'checked':'')+'></td><td><input type="checkbox" aria-label="想看" data-want="'+esc(m.imdb_id)+'" '+(r.want_to_watch?'checked':'')+'></td><td>'+esc((m.genres||'').replaceAll(' | ',' / '))+'</td><td><input class="note" data-note="'+esc(m.imdb_id)+'" value="'+esc(r.notes||'')+'" placeholder="添加备注"></td></tr>'}).join('');document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>save(x.dataset.check,{watched:x.checked}));document.querySelectorAll('[data-want]').forEach(x=>x.onchange=()=>save(x.dataset.want,{want_to_watch:x.checked}));document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>save(x.dataset.note,{notes:x.value}))}
async function save(id,patch){let prior=records[id]||{user_id:OWNER,imdb_id:id,watched:false,notes:'',priority:null};let next={...prior,...patch,updated_at:new Date().toISOString()};try{msg('正在保存…');await request('/rest/v1/personal_records?on_conflict=user_id,imdb_id',{method:'POST',headers:headers({'Content-Profile':'film_monitor','Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify(next)});records[id]=next;msg('已保存');}catch(e){msg('保存失败，请重新登录后重试：'+e.message);render()}}
['q','rating','year1','year2','lang','genre','watched','sort'].forEach(id=>$(id).addEventListener('input',()=>{page=1;render()}));$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};try{let s=JSON.parse(sessionStorage.getItem('film_session'));if(s)start(s).catch(()=>{sessionStorage.removeItem('film_session');location.reload()})}catch(e){}
</script></body></html>
